<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .titulo {
            color:blueviolet;
            font-size: 20px;
            text-align: center;
        }
        .menu{
            display: inline;
            color: rgb(0, 0, 0);
            background-color: lightseagreen;
            width: 1000px;
            height: 1000px;    
        }

        .menu_block{
            display: block;
            color: rgb(0, 0, 0);
            background-color: lightseagreen;
            width: 400px;
            height: 200px;
            border: 1px solid black;
        }
    
    </style>
</head>
<body>
    <h1 class="titulo">Elementos inline</h1>
    <div class="menu">Productos</div>
    <div class="menu">Servicios</div>
    <div class="menu">Contactos</div>
    <hr />
    <h1>Elementos block</h1>
    <div class="menu_block">Productos</div>
    <div class="menu_block">Servicios</div>
    <div class="menu_block">Contactos</div>
</body>
</html>
